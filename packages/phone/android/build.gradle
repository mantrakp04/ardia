plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.ardia.phone'
version = '0.0.0'

def repository = file("${projectDir}/../../..")
def androidApp = file("${repository}/apps/android")
def pageEngine = file("${androidApp}/browser/src/main")
def contentBlocking = file("${androidApp}/blocking/src/main")
def scriptRuntime = file("${androidApp}/shared/src/main")
def syncEngine = file("${androidApp}/sync/src")
def syncBundle = file("${repository}/apps/ios/Packages/ArdiaKit/Sources/ArdiaShared/Scripts/ardia-sync.js")
def syncFixtures = file("${repository}/packages/sync/tests/fixtures")
def phoneSchema = file("${repository}/apps/phone/src/state/store/schema.ts")
def pageEngineOutsideThisModule = ['**/Omnibox.kt', '**/PageSurface.kt']
def appModel = file("${androidApp}/appmodel/src/main/kotlin")
def codeScanner = file("${androidApp}/settings/src/main/kotlin")
def speech = file("${androidApp}/search/src/main/kotlin")
def faviconPixels = file("${androidApp}/design/src/main/kotlin")
def composeSourcesInThisModule = [
  (appModel): ['SystemLink.kt', 'SystemActions.kt'],
  (codeScanner): ['SyncCodeReading.kt', 'SyncCodeCamera.kt'],
  (speech): ['SpeechRecorder.kt', 'DictationTypes.kt', 'ClipboardOffer.kt'],
  (faviconPixels): ['FaviconPixels.kt'],
]
def cameraXVersion = '1.6.0'
def kotlinVersion = org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt.getKotlinPluginVersion(project)
def architectures = (findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64').split(',').collect { it.trim() }
def reactNative = new File(["node", "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim()).parentFile
def phoneApp = file("${repository}/apps/phone")

abstract class CompileSyncBundle extends DefaultTask {
  static final String REACT_NATIVE_VERSION = '0.81.6'
  static final Map<String, String> HERMESC_SHA256 = [
    'osx-bin/hermesc': '71b5e25546a50a453d2d35af7e29061b964a3b422d04d56d60a4e8d27cf3b8be',
    'linux64-bin/hermesc': 'b4c37f09410c6c6c0ce90df00eb270dc257d2184c85ca320382ebe06057f2a14',
    'win64-bin/hermesc.exe': 'a8c491973bcc3899e96a866380a8165a0e5e308bf123445d11def2450ee6e27f',
  ]
  static final byte[] HERMES_BYTECODE_MAGIC = [(byte) 0xC6, (byte) 0x1F, (byte) 0xBC, (byte) 0x03, (byte) 0xC1, (byte) 0x03, (byte) 0x19, (byte) 0x1F] as byte[]

  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getBundle()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getHermesc()
  @Input abstract Property<String> getHermescPath()
  @Input abstract Property<String> getReactNativeVersion()
  @Input abstract Property<String> getBabelVersion()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getTranspileScript()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getCheckScript()
  @InputFiles @PathSensitive(PathSensitivity.NONE) abstract ConfigurableFileCollection getCompanionHooks()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getCompanionTests()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getBabelPins()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getRuntimeChecks()
  @InputFile @PathSensitive(PathSensitivity.NONE) abstract RegularFileProperty getMakeChecksScript()
  @Input abstract Property<Boolean> getLab()
  @Internal abstract DirectoryProperty getPhoneApp()
  @OutputDirectory abstract DirectoryProperty getOutputDir()
  @Inject abstract ExecOperations getExec()

  @TaskAction
  void compile() {
    if (reactNativeVersion.get() != REACT_NATIVE_VERSION) throw new GradleException("ardia-sync.hbc is pinned to React Native ${REACT_NATIVE_VERSION}'s hermesc, found ${reactNativeVersion.get()}")
    def compiler = hermesc.get().asFile
    def expected = HERMESC_SHA256[hermescPath.get()]
    def actual = java.security.MessageDigest.getInstance('SHA-256').digest(compiler.bytes).encodeHex().toString()
    if (expected == null || actual != expected) throw new GradleException("${compiler} is not React Native ${REACT_NATIVE_VERSION}'s hermesc: sha256 ${actual}")
    def work = new File(temporaryDir, 'work')
    work.deleteDir()
    work.mkdirs()
    def transpiled = new File(work, 'ardia-sync.js')
    def bytecode = new File(work, 'ardia-sync.hbc')
    exec.exec { commandLine 'node', transpileScript.get().asFile.absolutePath, bundle.get().asFile.absolutePath, transpiled.absolutePath, phoneApp.get().asFile.absolutePath }
    exec.exec { commandLine 'node', checkScript.get().asFile.absolutePath, bundle.get().asFile.absolutePath, transpiled.absolutePath, phoneApp.get().asFile.absolutePath }
    def register = companionHooks.files.find { it.name == 'sync-bundle-register.mjs' }
    exec.exec {
      environment 'ARDIA_SYNC_BUNDLE', transpiled.absolutePath
      commandLine 'node', '--import', register.toURI().toString(), '--test', '--test-reporter=dot', companionTests.get().asFile.absolutePath
    }
    exec.exec { commandLine compiler.absolutePath, '-emit-binary', '-O', '-w', '-out', bytecode.absolutePath, transpiled.absolutePath }
    checkBytecode(bytecode)
    def results = [bytecode]
    if (lab.get()) {
      exec.exec { commandLine 'node', makeChecksScript.get().asFile.absolutePath, runtimeChecks.get().asFile.absolutePath, work.absolutePath, phoneApp.get().asFile.absolutePath }
      def checksBytecode = new File(work, 'ardia-sync-checks.hbc')
      exec.exec { commandLine compiler.absolutePath, '-emit-binary', '-O', '-w', '-out', checksBytecode.absolutePath, new File(work, 'ardia-sync-checks.js').absolutePath }
      checkBytecode(checksBytecode, 256)
      results += [checksBytecode, new File(work, 'ardia-sync-checks.json')]
    }
    def out = outputDir.get().asFile
    out.mkdirs()
    def names = results*.name as Set
    out.listFiles()?.findAll { !(it.name in names) }?.each { it.delete() }
    results.each { result ->
      def staged = new File(out, "${result.name}.partial")
      java.nio.file.Files.copy(result.toPath(), staged.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
      java.nio.file.Files.move(staged.toPath(), new File(out, result.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING, java.nio.file.StandardCopyOption.ATOMIC_MOVE)
    }
  }

  private static void checkBytecode(File bytecode, long smallest = 1024) {
    def head = new byte[8]
    bytecode.withInputStream { it.read(head) }
    if (bytecode.length() < smallest || !Arrays.equals(head, HERMES_BYTECODE_MAGIC)) throw new GradleException("hermesc wrote no Hermes bytecode to ${bytecode}")
  }
}

def hermescPath = System.getProperty('os.name').toLowerCase().contains('mac') ? 'osx-bin/hermesc' : (System.getProperty('os.name').toLowerCase().contains('win') ? 'win64-bin/hermesc.exe' : 'linux64-bin/hermesc')
def babelVersion = new groovy.json.JsonSlurper().parse(new File(["node", "--print", "require.resolve('@babel/core/package.json', { paths: [require.resolve('@react-native/babel-preset/package.json', { paths: [require.resolve('babel-preset-expo/package.json')] })] })"].execute(null, phoneApp).text.trim())).version
def reactNativeVersion = new groovy.json.JsonSlurper().parse(new File(reactNative, 'package.json')).version

androidComponents {
  onVariants(selector().all()) { variant ->
    def task = tasks.register("compile${variant.name.capitalize()}SyncBundle", CompileSyncBundle) {
      bundle.set(syncBundle)
      hermesc.set(new File(reactNative, "sdks/hermesc/${hermescPath}"))
      it.hermescPath.set(hermescPath)
      it.reactNativeVersion.set(reactNativeVersion)
      it.babelVersion.set(babelVersion)
      transpileScript.set(file("${projectDir}/scripts/transpile-sync-bundle.mjs"))
      checkScript.set(file("${projectDir}/scripts/check-sync-bundle.mjs"))
      companionHooks.from(file("${projectDir}/scripts/sync-bundle-register.mjs"), file("${projectDir}/scripts/sync-bundle-hooks.mjs"))
      companionTests.set(file("${repository}/packages/sync/src/companion/companion.test.ts"))
      babelPins.set(file("${projectDir}/scripts/sync-babel-pins.json"))
      runtimeChecks.set(file("${projectDir}/scripts/sync-runtime-checks.js"))
      makeChecksScript.set(file("${projectDir}/scripts/make-sync-checks.mjs"))
      lab.set(findProperty('ardiaLab') == 'true')
      it.phoneApp.set(phoneApp)
    }
    variant.sources.assets?.addGeneratedSourceDirectory(task, { CompileSyncBundle compile -> compile.outputDir })
  }
}

android {
  namespace "com.ardia.browser"
  defaultConfig {
    versionCode 1
    versionName "0.0.0"
    externalNativeBuild {
      cmake {
        arguments "-DANDROID_STL=c++_shared", "-DARDIA_SCRIPT_SHIM=${scriptRuntime}/cpp/ardia_hermes.cpp", "-DARDIA_SCRIPT_LOGS=${findProperty('ardiaLab') == 'true' ? 'ON' : 'OFF'}"
        abiFilters(*architectures)
        targets "ardiahermes"
      }
    }
    buildConfigField "boolean", "ARDIA_LAB", (findProperty('ardiaLab') == 'true').toString()
  }
  buildFeatures {
    prefab true
    buildConfig true
  }
  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
      version "3.22.1"
    }
  }
  buildTypes {
    debug {
      externalNativeBuild {
        cmake {
          arguments "-DHERMES_ENABLE_DEBUGGER=1"
        }
      }
    }
  }
  sourceSets {
    main {
      java.srcDirs += ["${pageEngine}/kotlin", "${contentBlocking}/kotlin", "${scriptRuntime}/kotlin", "${syncEngine}/main/kotlin", appModel, codeScanner, speech, faviconPixels]
      assets.srcDirs += "${pageEngine}/assets"
      res.srcDirs += "${pageEngine}/res"
      resources.srcDirs += "${contentBlocking}/resources"
    }
    test {
      java.srcDirs += "${syncEngine}/test/kotlin"
    }
  }
  packagingOptions {
    excludes += [
      "**/libc++_shared.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libhermes.so",
      "**/libhermestooling.so",
      "**/libreactnative.so",
    ]
  }
  testOptions {
    unitTests.returnDefaultValues = true
    unitTests.all { test ->
      test.systemProperty("ardia.syncFixtures", syncFixtures.absolutePath)
      test.systemProperty("ardia.phoneSchema", phoneSchema.absolutePath)
    }
  }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
  exclude(pageEngineOutsideThisModule)
  exclude { element ->
    if (element.directory) return false
    def root = composeSourcesInThisModule.keySet().find { element.file.toPath().startsWith(it.toPath()) }
    root != null && !(element.name in composeSourcesInThisModule[root])
  }
}

dependencies {
  kotlinCompilerPluginClasspath "org.jetbrains.kotlin:kotlin-serialization-compiler-plugin-embeddable:${kotlinVersion}"
  implementation "com.facebook.react:react-android"
  implementation "com.facebook.react:hermes-android"
  implementation "androidx.annotation:annotation:1.9.1"
  implementation "androidx.core:core:1.16.0"
  implementation "androidx.webkit:webkit:1.18.0"
  implementation "androidx.work:work-runtime-ktx:2.10.5"
  implementation "com.squareup.okhttp3:okhttp:4.12.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2"
  implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0"
  implementation "com.google.re2j:re2j:1.8"
  implementation "androidx.camera:camera-core:${cameraXVersion}"
  implementation "androidx.camera:camera-camera2:${cameraXVersion}"
  implementation "androidx.camera:camera-lifecycle:${cameraXVersion}"
  implementation "androidx.camera:camera-view:${cameraXVersion}"
  implementation "com.google.zxing:core:3.5.4"
  implementation project(":ardia-design")
  compileOnly "com.google.guava:guava:33.3.1-android"
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.json:json:20240303"
  testImplementation "org.xerial:sqlite-jdbc:3.41.2.2"
  testImplementation "org.robolectric:robolectric:4.17"
}
