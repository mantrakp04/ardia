name: Vouch

on:
  pull_request_target:
    types: [opened, reopened, labeled]
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - ".github/VOUCHED.td"
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only log what the sweep would change
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  vouch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.issue.state == 'open' &&
        github.event.comment.body == '/recheck')) &&
      (github.event_name != 'pull_request_target' || github.event.action != 'labeled' ||
       github.event.label.name == 'run-ci')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const vouch = require(`${process.env.GITHUB_WORKSPACE}/.github/vouch/vouch.cjs`);
            await vouch.run({ github, context, core });
