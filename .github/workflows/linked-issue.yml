name: Linked issue

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          count=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences | length')
          if [ "$count" -eq 0 ] && [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            for number in $(printf '%s' "$PR_BODY" | grep -oiE '(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' | grep -oE '[0-9]+$' | sort -u); do
              if [ "$(gh api "repos/$REPO/issues/$number" --jq 'has("pull_request")' 2>/dev/null)" = "false" ]; then
                count=$((count + 1))
              fi
            done
            if [ "$count" -gt 0 ]; then
              echo "Based on $BASE_REF, where GitHub links no issues: counted the issues its description closes."
            fi
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::This PR doesn't close an issue. Open an issue first, then add 'Closes #<issue>' to the PR description (CONTRIBUTING.md, Pull requests)."
            exit 1
          fi
          echo "Closes $count issue(s)."
