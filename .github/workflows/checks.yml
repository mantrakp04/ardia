name: Checks

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "extras/**"
      - "scripts/**"
      - ".github/vouch/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "patches/**"
      - ".github/workflows/checks.yml"
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "extras/**"
      - "scripts/**"
      - ".github/vouch/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "patches/**"
      - ".github/workflows/checks.yml"

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests that need no Mac
        if: ${{ !cancelled() }}
        run: pnpm test:portable
      - name: Vouch tests
        if: ${{ !cancelled() }}
        run: node --test .github/vouch/vouch.test.cjs
