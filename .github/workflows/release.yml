name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, as committed in MARKETING_VERSION (0.2.42 or 0.2.42-nightly.1)
        type: string
        required: true
      channel:
        description: Channel
        type: choice
        options: [nightly, stable]
        default: nightly
      intel:
        description: Build and ship the Intel app too
        type: boolean
        default: true
      dry_run:
        description: Dry run, a release candidate that publishes nothing
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  TURBO_TELEMETRY_DISABLED: 1
  VERSION: ${{ inputs.version }}
  CHANNEL: ${{ inputs.channel }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      arches: ${{ steps.plan.outputs.arches }}
      release_archs: ${{ steps.plan.outputs.release_archs }}
      tree: ${{ steps.plan.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INTEL: ${{ inputs.intel }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          check() { if [ "$DRY_RUN" = true ]; then echo "::warning::$* (a real release would stop here)"; else fail "$*"; fi; }
          case "$CHANNEL" in
            nightly) [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]+$ ]] || fail "a nightly is <next stable>-nightly.<n>, not $VERSION" ;;
            stable) [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "a stable version is <major>.<minor>.<patch>, not $VERSION" ;;
          esac
          project=$(sed -n 's/.*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};/\1/p' apps/browser/macos/Ardia.xcodeproj/project.pbxproj | sort -u)
          [ "$project" = "$VERSION" ] || check "MARKETING_VERSION is $project: commit the bump to $VERSION first"
          [ -f "docs/release-notes/$VERSION.md" ] || check "no docs/release-notes/$VERSION.md: write and commit the notes first"
          if gh release view "v$VERSION" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then check "v$VERSION is already published"; fi
          tree=$(git rev-parse HEAD:engine)
          if [ "$INTEL" = true ]; then
            arches='["arm64","x86_64"]' release_archs="arm64 x86_64"
          else
            arches='["arm64"]' release_archs="arm64"
          fi
          { echo "arches=$arches"; echo "release_archs=$release_archs"; echo "tree=$tree"; } >> "$GITHUB_OUTPUT"
          {
            echo "### Ardia $VERSION ($CHANNEL)"
            echo "- commit \`$GITHUB_SHA\`, engine tree \`${tree:0:12}\`"
            echo "- arches: $release_archs"
            if [ "$DRY_RUN" = true ]; then echo "- dry run: a release candidate, nothing published"; else echo "- publishes"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  checks:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm test
      - if: ${{ !cancelled() }}
        run: pnpm shaders:check

  build:
    needs: preflight
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.preflight.outputs.arches) }}
    env:
      ARCH: ${{ matrix.arch }}
      CAS_PATH: ${{ github.workspace }}/.xcode-cas
      DERIVED_DATA: ${{ github.workspace }}/apps/browser/build-release-ci
      TREE: ${{ needs.preflight.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: paths
        run: |
          if [ "$ARCH" = x86_64 ]; then suffix=-x64 feed=appcast-x64.xml store=prebuilt-x86_64; else suffix="" feed=appcast.xml store=prebuilt; fi
          if [ "$DRY_RUN" = true ]; then dist="dist/$VERSION-rc$suffix"; else dist="dist/$VERSION$suffix"; fi
          { echo "suffix=$suffix"; echo "feed=$feed"; echo "dist=$dist"; echo "store=apps/browser/build-ardiacore/$store"; } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.paths.outputs.store }}
          key: engine-${{ matrix.arch }}-${{ env.TREE }}
      - name: Engine
        run: |
          if [ "$ARCH" = x86_64 ]; then fetch=(packages/ardiacore/scripts/fetch-engine.sh --arch x86_64); else fetch=(packages/ardiacore/scripts/fetch-engine.sh); fi
          if ! framework=$("${fetch[@]}"); then
            if [ "$ARCH" = x86_64 ]; then
              echo "::error::no x64 engine for ${TREE:0:12} yet: run Engine x64 (.github/workflows/engine-x64.yml) on this commit, then dispatch the release again"
            else
              echo "::error::no arm64 engine for ${TREE:0:12}: build it here and publish it with scripts/publish-engine.sh, then commit prebuilt-engines.tsv"
            fi
            exit 1
          fi
          { echo "ARDIACORE_FRAMEWORK=$framework"; echo "ARDIACORE_FRAMEWORK_ENGINE=$TREE"; } >> "$GITHUB_ENV"
      - if: matrix.arch == 'x86_64'
        name: Rosetta
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: uv
        run: curl -LsSf https://astral.sh/uv/0.12.15/install.sh | sh
      - id: cas-key
        run: echo "prefix=xcode-cas-release-$ARCH-$(xcodebuild -version | awk '/Build version/ { print $3 }')-$(date -u +%Y-%m)-" >> "$GITHUB_OUTPUT"
      - id: cas
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .xcode-cas
          key: ${{ steps.cas-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cas-key.outputs.prefix }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            apps/browser/macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('apps/browser/macos/Podfile', 'apps/browser/macos/Podfile.lock', 'pnpm-lock.yaml', 'patches/**') }}
          restore-keys: pods-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ardiacore/vendor/ubo
          key: ubo-${{ hashFiles('packages/ardiacore/scripts/ubo.sh') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/Library/Caches/ardia-cli-build
          key: ardia-cli-${{ matrix.arch }}-${{ hashFiles('apps/cli/scripts/build.sh', 'apps/cli/requirements.lock') }}
      - name: Pods
        working-directory: apps/browser/macos
        run: pod install
      - name: Tree is clean
        run: |
          pods=(apps/browser/macos/Podfile.lock apps/browser/macos/Ardia.xcodeproj/project.pbxproj)
          normalize() { sed -E 's/^[-+]//; s/"//g; s/^(  ArdiaCore: )[0-9a-f]{40}$/\1checksum/'; }
          removed=$(git diff -U0 -- "${pods[@]}" | { grep '^-[^-]' || true; } | normalize)
          added=$(git diff -U0 -- "${pods[@]}" | { grep '^+[^+]' || true; } | normalize)
          if [ -n "$removed$added" ] && [ "$removed" = "$added" ]; then
            echo "::notice::pod install only quoted MARKETING_VERSION and rehashed ArdiaCore's podspec (its checksum includes this checkout's path): kept, not counted as changes"
            git update-index --assume-unchanged "${pods[@]}"
          fi
          dirty=$(git status --porcelain -- apps/browser apps/cli packages engine scripts/dmg | grep -v ' apps/browser/build' || true)
          [ -z "$dirty" ] || {
            echo "::error::installing changed tracked files, so release.sh would refuse the tree:"
            echo "$dirty"
            git diff -- apps/browser apps/cli packages engine scripts/dmg | head -150
            exit 1
          }
      - name: Build
        env:
          FEED: ${{ steps.paths.outputs.feed }}
        run: |
          args=("$VERSION" --channel "$CHANNEL" --arch "$ARCH" --phase build)
          if [ "$DRY_RUN" = true ]; then args+=(--rc); fi
          if ! curl -fsIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$FEED"; then
            echo "::notice::the latest release has no $FEED: this release starts it"
            export APPCAST_BASE=none
          fi
          export RELEASE_BUILD_DIR="$DERIVED_DATA"
          export RELEASE_BUILD_SETTINGS="COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=$CAS_PATH"
          scripts/release.sh "${args[@]}"
      - name: Pack the build
        env:
          DIST: ${{ steps.paths.outputs.dist }}
        run: |
          name=$(basename "$DIST")
          tar -cf "$RUNNER_TEMP/build-$ARCH.tar" -C dist "$name/Ardia.xcarchive" "$name/provenance.txt" \
            "$name/ardia-cli-$VERSION-macos-$ARCH.tar.gz" "$name/ardia-cli-$VERSION-macos-$ARCH.tar.gz.sha256"
      - if: always() && steps.cas.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .xcode-cas
          key: ${{ steps.cas-key.outputs.prefix }}${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-${{ matrix.arch }}
          path: ${{ runner.temp }}/build-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-logs-${{ matrix.arch }}
          path: ${{ steps.paths.outputs.dist }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  sign:
    needs: [preflight, build]
    runs-on: xcode-27
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.preflight.outputs.arches) }}
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: paths
        run: |
          if [ "$ARCH" = x86_64 ]; then suffix=-x64 feed=appcast-x64.xml; else suffix="" feed=appcast.xml; fi
          if [ "$DRY_RUN" = true ]; then dist="dist/$VERSION-rc$suffix"; else dist="dist/$VERSION$suffix"; fi
          { echo "suffix=$suffix"; echo "feed=$feed"; echo "dist=$dist"; } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: build-${{ matrix.arch }}
          path: ${{ runner.temp }}
      - name: Unpack the build
        run: |
          mkdir -p dist
          tar -xf "$RUNNER_TEMP/build-$ARCH.tar" -C dist
          rm "$RUNNER_TEMP/build-$ARCH.tar"
      - name: Sparkle's tools
        run: |
          tarball="$RUNNER_TEMP/Sparkle-2.9.6.tar.xz"
          curl -fsSL --retry 3 -o "$tarball" https://github.com/sparkle-project/Sparkle/releases/download/2.9.6/Sparkle-2.9.6.tar.xz
          [ "$(shasum -a 256 "$tarball" | awk '{ print $1 }')" = 52bf9e88cdd972fc0c81501377a880e90d47031bd8ca5462488f843e2609e192 ] \
            || { echo "::error::Sparkle-2.9.6.tar.xz didn't match its pinned SHA-256"; exit 1; }
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$tarball" -C "$RUNNER_TEMP/sparkle" bin
          echo "SPARKLE_BIN=$RUNNER_TEMP/sparkle/bin" >> "$GITHUB_ENV"
      - name: Signing
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          ALLOW_MISSING_NOTARY: ${{ inputs.dry_run && '1' || '0' }}
        run: .github/release/signing.sh setup
      - name: Sign, notarize, package
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          RELEASE_ARCHS: ${{ needs.preflight.outputs.release_archs }}
          FEED: ${{ steps.paths.outputs.feed }}
        run: |
          args=("$VERSION" --channel "$CHANNEL" --arch "$ARCH" --phase sign)
          if [ "$DRY_RUN" = true ]; then args+=(--rc); fi
          if ! curl -fsIL -o /dev/null "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/$FEED"; then
            export APPCAST_BASE=none
          fi
          scripts/release.sh "${args[@]}"
      - if: always()
        name: Remove signing
        run: .github/release/signing.sh cleanup
      - if: matrix.arch == 'x86_64'
        name: Rosetta
        run: /usr/bin/arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Launch check
        run: |
          args=("$VERSION" --channel "$CHANNEL" --arch "$ARCH" --phase check)
          if [ "$DRY_RUN" = true ]; then args+=(--rc); fi
          scripts/release.sh "${args[@]}"
      - name: Update signature
        env:
          DIST: ${{ steps.paths.outputs.dist }}
          FEED: ${{ steps.paths.outputs.feed }}
          SUFFIX: ${{ steps.paths.outputs.suffix }}
        run: .github/release/check-sparkle.sh "$DIST" "$FEED" "$VERSION" "$DIST/Ardia-$VERSION$SUFFIX.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-${{ matrix.arch }}
          path: |
            ${{ steps.paths.outputs.dist }}/Ardia-${{ inputs.version }}${{ steps.paths.outputs.suffix }}.dmg
            ${{ steps.paths.outputs.dist }}/Ardia-${{ inputs.version }}${{ steps.paths.outputs.suffix }}.zip
            ${{ steps.paths.outputs.dist }}/${{ steps.paths.outputs.feed }}
            ${{ steps.paths.outputs.dist }}/release-notes.md
            ${{ steps.paths.outputs.dist }}/provenance.txt
            ${{ steps.paths.outputs.dist }}/ardia-cli-${{ inputs.version }}-macos-${{ matrix.arch }}.tar.gz
            ${{ steps.paths.outputs.dist }}/ardia-cli-${{ inputs.version }}-macos-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sign-logs-${{ matrix.arch }}
          path: ${{ steps.paths.outputs.dist }}/*.log
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [preflight, checks, sign]
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-arm64
          path: dist/${{ inputs.version }}
      - if: inputs.intel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: release-x86_64
          path: dist/${{ inputs.version }}-x64
      - name: Tag
        if: ${{ !inputs.dry_run }}
        run: |
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"
      - name: Publish
        env:
          INTEL: ${{ inputs.intel }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          export RELEASE_DIST="$GITHUB_WORKSPACE/dist/$VERSION"
          if [ "$INTEL" = true ]; then export RELEASE_DIST_X64="$GITHUB_WORKSPACE/dist/$VERSION-x64"; fi
          if [ -n "$TAP_TOKEN" ]; then
            git config --global url."https://x-access-token:$TAP_TOKEN@github.com/mantrakp04/homebrew-tap".insteadOf https://github.com/mantrakp04/homebrew-tap
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          else
            export PUBLISH_TAP=0
          fi
          if [ "$DRY_RUN" = true ]; then
            .claude/skills/release/scripts/publish.sh "$VERSION" --dry-run
          else
            .claude/skills/release/scripts/publish.sh "$VERSION"
          fi
