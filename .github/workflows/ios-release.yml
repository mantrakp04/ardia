name: iOS Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: status lists what App Store Connect holds; nothing is built or uploaded
        type: choice
        options: [status]
        default: status

concurrency:
  group: ios-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  status:
    if: inputs.mode == 'status'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: App Store Connect
        env:
          ASC_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ASC_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/AuthKey.p8"
          (umask 077 && printf '%s' "$ASC_KEY_P8" | base64 -d > "$key")
          trap 'rm -f "$key"' EXIT
          ASC_KEY="$key" node apps/ios/scripts/asc.mjs status | tee -a "$GITHUB_STEP_SUMMARY"
