name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "apps/site/**"
      - "apps/videos/**"
      - "apps/dashboard/**"
      - "docs/**"
      - "infra/**"
      - ".claude/**"
      - "**/*.md"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      - run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm test
      - if: ${{ !cancelled() }}
        run: pnpm shaders:check

  app-arm64:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      CAS_PATH: ${{ github.workspace }}/.xcode-cas
      DERIVED_DATA: ${{ github.workspace }}/apps/browser/build-ci
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: cas-key
        run: echo "prefix=xcode-cas-arm64-$(xcodebuild -version | awk '/Build version/ { print $3 }')-$(date -u +%Y-%m)-" >> "$GITHUB_OUTPUT"
      - id: cas
        uses: actions/cache/restore@v6
        with:
          path: .xcode-cas
          key: ${{ steps.cas-key.outputs.prefix }}${{ github.sha }}
          restore-keys: ${{ steps.cas-key.outputs.prefix }}
      - uses: actions/cache@v6
        with:
          path: |
            apps/browser/macos/Pods
            ~/Library/Caches/CocoaPods
          key: pods-${{ hashFiles('apps/browser/macos/Podfile', 'apps/browser/macos/Podfile.lock', 'pnpm-lock.yaml', 'patches/**') }}
          restore-keys: pods-
      - uses: actions/cache@v6
        with:
          path: packages/ardiacore/vendor/ubo
          key: ubo-${{ hashFiles('packages/ardiacore/scripts/ubo.sh') }}
      - uses: actions/cache@v6
        with:
          path: apps/browser/build-ardiacore/prebuilt
          key: engine-${{ hashFiles('packages/ardiacore/prebuilt-engines.tsv') }}
          restore-keys: engine-
      - name: Pods
        working-directory: apps/browser/macos
        run: pod install
      - name: Engine
        run: |
          framework=$(packages/ardiacore/scripts/fetch-engine.sh --nearest)
          echo "ARDIACORE_FRAMEWORK=$framework" >> "$GITHUB_ENV"
      - name: Build
        working-directory: apps/browser
        run: |
          set -o pipefail
          mkdir -p "$DERIVED_DATA"
          xcodebuild -workspace macos/Ardia.xcworkspace -scheme Ardia-macOS -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath "$DERIVED_DATA" \
            -xcconfig macos/AdHoc.xcconfig ARCHS=arm64 \
            COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$CAS_PATH" \
            -hideShellScriptEnvironment -showBuildTimingSummary build \
            > "$DERIVED_DATA/build.log" 2>&1 || {
              grep -E "(^|\s)(fatal )?error:|BUILD FAILED|The following build commands failed" -A3 "$DERIVED_DATA/build.log" \
                | grep -v MACOSX_DEPLOYMENT_TARGET | head -80
              tail -40 "$DERIVED_DATA/build.log"
              exit 1
            }
          sed -n '/Build Timing Summary/,$p' "$DERIVED_DATA/build.log" | head -30
          du -sh "$CAS_PATH"
      - if: always() && steps.cas.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .xcode-cas
          key: ${{ steps.cas-key.outputs.prefix }}${{ github.sha }}
      - name: Package
        run: |
          app="$DERIVED_DATA/Build/Products/Release/Ardia.app"
          codesign --verify --deep --strict "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/Ardia-arm64.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: Ardia-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/Ardia-arm64.zip
          compression-level: 0
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ github.sha }}
          path: apps/browser/build-ci/build.log
          retention-days: 7
