name: Linux

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine, the nearest published one (labelled when older than this commit's engine/) or an exact match
        type: choice
        options: [nearest, exact]
        default: nearest

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  ARDIACORE_PREBUILT_REPO: ${{ vars.ARDIACORE_PREBUILT_REPO || 'mckamyk/ardia' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-setup
      - name: Stock Chromium
        run: echo "$(readlink -f /usr/bin/chromium) $(/usr/bin/chromium --version)"
      - run: scripts/linux/ci-checks.sh --logs "$RUNNER_TEMP/checks"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checks-logs
          path: ${{ runner.temp }}/checks
          if-no-files-found: ignore
          retention-days: 14

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENGINE_MODE: ${{ inputs.engine || 'nearest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: engine-key
        run: echo "key=$(engine/engine-key.sh)" >> "$GITHUB_OUTPUT"
      - name: Version
        run: |
          set -euo pipefail
          version=$(sed -n 's/.*MARKETING_VERSION = "\{0,1\}\([^";]*\)"\{0,1\};/\1/p' apps/browser/macos/Ardia.xcodeproj/project.pbxproj | sort -u)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[a-z]+\.[0-9]+)?$ ]]; then
            echo "::error::MARKETING_VERSION isn't one version: '$version'"
            exit 1
          fi
          { echo "VERSION=$version"; echo "CLI_NAME=ardia-cli-$version-linux-x64.tar.gz"; } >> "$GITHUB_ENV"
      - uses: ./.github/actions/linux-setup
        with:
          packages: >-
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libdbus-1-3
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxkbcommon0
            libgbm1 libdrm2 libexpat1 libcairo2 libpango-1.0-0 libudev1 libasound2t64 libglib2.0-0t64
            libgtk-3-0t64 libsecret-1-0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/build-ardiacore/prebuilt-linux-x86_64
          key: engine-linux-x64-v2-${{ steps.engine-key.outputs.key }}-${{ hashFiles('packages/ardiacore/prebuilt-engines-linux.tsv') }}
          restore-keys: engine-linux-x64-v2-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ardia-cli-build
          key: ardia-cli-build-linux-x64-${{ hashFiles('apps/cli/scripts/build.sh', 'apps/cli/requirements.lock') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ardiacore/vendor/ubo
          key: ubo-linux-${{ hashFiles('packages/ardiacore/scripts/ubo.sh') }}
      - name: Engine
        env:
          ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
        run: |
          set -euo pipefail
          args=(--arch linux-x86_64)
          [ "$ENGINE_MODE" = exact ] || args+=(--nearest)
          if ! engine=$(packages/ardiacore/scripts/fetch-engine.sh "${args[@]}"); then
            echo "::error::no Linux engine for engine key ${ENGINE_KEY:0:12}: build it on the Linux builder, publish it with scripts/linux/publish-engine.sh --upload and commit prebuilt-engines-linux.tsv"
            exit 1
          fi
          selected=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["engine_key"])' "$engine/manifest.json")
          if [ "$selected" = "$ENGINE_KEY" ]; then
            label="${GITHUB_SHA:0:12}"
            echo "ENGINE_EXACT=1" >> "$GITHUB_ENV"
            echo "### Linux engine ${ENGINE_KEY:0:12} (exact)" >> "$GITHUB_STEP_SUMMARY"
          else
            label="${GITHUB_SHA:0:12}-engine-${selected:0:12}"
            echo "::warning::built against an older engine, ${selected:0:12}, not this commit's ${ENGINE_KEY:0:12}"
            echo "### Linux engine ${selected:0:12} (older than this commit's ${ENGINE_KEY:0:12})" >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "ENGINE=$engine"; echo "PACKAGE_NAME=Ardia-linux-x64-$label"; } >> "$GITHUB_ENV"
      - run: pnpm --filter @ardia/linux build
      - name: uv
        run: curl -LsSf https://astral.sh/uv/0.12.15/install.sh | sh
      - name: ardia CLI
        run: apps/cli/scripts/build.sh "$VERSION" "$RUNNER_TEMP/dist" --platform linux-x64
      - name: Package
        run: |
          set -euo pipefail
          blocker=$(scripts/linux/fetch-ubo.sh)
          python3 scripts/linux/package.py --out "$ENGINE" --ui apps/linux/dist --content-blocker "$blocker" \
            --version "$VERSION" --cli "$RUNNER_TEMP/dist/$CLI_NAME" --destination "$RUNNER_TEMP/dist/$PACKAGE_NAME.tar.xz"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$PACKAGE_NAME.tar.xz" > "$PACKAGE_NAME.tar.xz.sha256")
      - name: Smoke
        run: |
          set -euo pipefail
          args=(--package "$RUNNER_TEMP/dist/$PACKAGE_NAME.tar.xz" --results "$RUNNER_TEMP/smoke" --timeout-ms 600000)
          [ "${ENGINE_EXACT:-0}" = 1 ] || args+=(--allow-old-engine)
          node scripts/linux/smoke.mjs "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ runner.temp }}/dist/${{ env.PACKAGE_NAME }}.tar.xz
            ${{ runner.temp }}/dist/${{ env.PACKAGE_NAME }}.tar.xz.sha256
            ${{ runner.temp }}/dist/${{ env.CLI_NAME }}
            ${{ runner.temp }}/dist/${{ env.CLI_NAME }}.sha256
            ${{ runner.temp }}/smoke/results.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-logs
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14
