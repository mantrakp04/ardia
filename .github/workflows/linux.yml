name: Linux

on:
  workflow_dispatch:
    inputs:
      engine:
        description: Engine, the nearest published one (labelled when older than this commit's engine/) or an exact match
        type: choice
        options: [nearest, exact]
        default: nearest

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  ARDIACORE_PREBUILT_REPO: ${{ vars.ARDIACORE_PREBUILT_REPO || 'mckamyk/ardia' }}

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/linux-setup
      - name: Stock Chromium
        run: echo "$(readlink -f /usr/bin/chromium) $(/usr/bin/chromium --version)"
      - run: scripts/linux/ci-checks.sh --logs "$RUNNER_TEMP/checks"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: checks-logs
          path: ${{ runner.temp }}/checks
          if-no-files-found: ignore
          retention-days: 14

  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENGINE_MODE: ${{ inputs.engine || 'nearest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: tree
        run: echo "tree=$(git rev-parse HEAD:engine)" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/linux-setup
        with:
          packages: >-
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libatspi2.0-0t64 libcups2t64 libdbus-1-3
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxkbcommon0
            libgbm1 libdrm2 libexpat1 libcairo2 libpango-1.0-0 libudev1 libasound2t64 libglib2.0-0t64
            libgtk-3-0t64 libsecret-1-0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: apps/browser/build-ardiacore/prebuilt-linux-x86_64
          key: engine-linux-x64-v1-${{ steps.tree.outputs.tree }}-${{ hashFiles('packages/ardiacore/prebuilt-engines-linux.tsv') }}
          restore-keys: engine-linux-x64-v1-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: packages/ardiacore/vendor/ubo
          key: ubo-linux-${{ hashFiles('packages/ardiacore/scripts/ubo.sh') }}
      - name: Engine
        env:
          TREE: ${{ steps.tree.outputs.tree }}
        run: |
          set -euo pipefail
          args=(--arch linux-x86_64)
          [ "$ENGINE_MODE" = exact ] || args+=(--nearest)
          if ! engine=$(packages/ardiacore/scripts/fetch-engine.sh "${args[@]}"); then
            echo "::error::no Linux engine for ${TREE:0:12}: build it on the Linux builder, publish it with scripts/linux/publish-engine.sh --upload and commit prebuilt-engines-linux.tsv"
            exit 1
          fi
          selected=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["engine_tree"])' "$engine/manifest.json")
          if [ "$selected" = "$TREE" ]; then
            label="${GITHUB_SHA:0:12}"
            echo "### Linux engine ${TREE:0:12} (exact)" >> "$GITHUB_STEP_SUMMARY"
          else
            label="${GITHUB_SHA:0:12}-engine-${selected:0:12}"
            echo "::warning::built against an older engine, ${selected:0:12}, not this commit's ${TREE:0:12}"
            echo "### Linux engine ${selected:0:12} (older than this commit's ${TREE:0:12})" >> "$GITHUB_STEP_SUMMARY"
          fi
          { echo "ENGINE=$engine"; echo "PACKAGE_NAME=Ardia-linux-x64-$label"; } >> "$GITHUB_ENV"
      - run: pnpm --filter @ardia/linux build
      - name: Package
        run: |
          set -euo pipefail
          blocker=$(scripts/linux/fetch-ubo.sh)
          mkdir -p "$RUNNER_TEMP/dist"
          python3 scripts/linux/package.py --out "$ENGINE" --ui apps/linux/dist --content-blocker "$blocker" \
            --destination "$RUNNER_TEMP/dist/$PACKAGE_NAME.tar.xz"
          (cd "$RUNNER_TEMP/dist" && sha256sum "$PACKAGE_NAME.tar.xz" > "$PACKAGE_NAME.tar.xz.sha256")
      - name: Smoke
        run: node scripts/linux/smoke.mjs --package "$RUNNER_TEMP/dist/$PACKAGE_NAME.tar.xz" --results "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            ${{ runner.temp }}/dist/${{ env.PACKAGE_NAME }}.tar.xz
            ${{ runner.temp }}/dist/${{ env.PACKAGE_NAME }}.tar.xz.sha256
            ${{ runner.temp }}/smoke/results.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: package-logs
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14
