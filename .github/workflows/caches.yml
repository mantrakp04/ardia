name: Caches

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would be deleted and delete nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: caches
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        shell: bash
        run: >-
          node scripts/ci/prune-caches.mjs $DRY_RUN
          --newest-only xcode-cas-release-
          --newest-only swiftpm-xcode-
          --newest-only turbo- | tee -a "$GITHUB_STEP_SUMMARY"
