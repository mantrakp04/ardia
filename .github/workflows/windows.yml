name: Windows

on:
  pull_request:
    paths:
      - "apps/browser/windows/**"
      - "apps/browser/NuGet.config"
      - "apps/browser/index.js"
      - "apps/browser/metro.config.js"
      - "apps/browser/src/**"
      - "packages/*/src/**"
      - "apps/browser/package.json"
      - "packages/expo-windows/**"
      - "scripts/windows/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "apps/browser/windows/**"
      - "apps/browser/NuGet.config"
      - "apps/browser/index.js"
      - "apps/browser/metro.config.js"
      - "apps/browser/src/**"
      - "packages/*/src/**"
      - "apps/browser/package.json"
      - "packages/expo-windows/**"
      - "scripts/windows/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.vouch.outputs.run }}
      full: ${{ steps.depth.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github
      - id: vouch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            const vouch = require(`${process.env.GITHUB_WORKSPACE}/.github/vouch/vouch.cjs`);
            await vouch.gate({ github, context, core });
      - id: depth
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          retries: 3
          script: |
            let full = context.eventName !== "pull_request";
            if (!full) {
              const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number });
              full = pr.labels.some((label) => label.name === "full-ci");
            }
            core.setOutput("full", full ? "true" : "false");
            core.info(full ? "Full run: compile, tours and installers." : "Fast run: reuse a built app when the native code is unchanged, then launch it.");

  app:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    permissions:
      contents: write
    env:
      CPU: x64
      SLUG: x64
      APP: apps/browser/windows/x64/Release
      HERMES: .ci/windows-hermes/hermes.exe
      FULL: ${{ needs.gate.outputs.full }}
    steps: &app_steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Toolchain
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
          node --version
      - name: Name the native code
        id: native
        shell: bash
        env:
          TREE: ${{ hashFiles('apps/browser/windows/**', 'apps/browser/NuGet.config', 'apps/browser/package.json', 'apps/browser/app.json', 'apps/browser/react-native.config.js', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'patches/**', 'scripts/windows/rebundle.ps1', '.github/workflows/windows.yml') }}
        run: echo "key=windows-app-${{ env.SLUG }}-$TREE" >> "$GITHUB_OUTPUT"
      - name: Look for an app built from this native code
        id: built
        if: env.FULL != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.APP }}
            .ci/windows-hermes
          key: ${{ steps.native.outputs.key }}
      - name: Build the app
        if: steps.built.outputs.cache-hit != 'true'
        working-directory: apps/browser
        run: npx react-native run-windows --release --arch ${{ env.CPU }} --no-launch --no-deploy --no-packager --no-telemetry --logging
      - name: Keep the Hermes compiler beside the built app
        if: steps.built.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $packages = if ($env:NUGET_PACKAGES) { $env:NUGET_PACKAGES } else { Join-Path $env:USERPROFILE ".nuget\packages" }
          $compilers = @(Get-ChildItem -Path (Join-Path $packages "microsoft.javascript.hermes\*\tools\native\release\x86\hermes.exe"))
          if ($compilers.Count -ne 1) { throw "expected one Hermes compiler under $packages, found $($compilers.Count)" }
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $env:HERMES) | Out-Null
          Copy-Item -LiteralPath $compilers[0].FullName -Destination $env:HERMES
          $digest = (Get-FileHash -LiteralPath "$env:APP/Bundle/index.windows.bundle" -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "build: index.windows.bundle has SHA-256 $digest"
      - name: Save the built app
        if: steps.built.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.APP }}
            .ci/windows-hermes
          key: ${{ steps.native.outputs.key }}
      - name: Put this change's JavaScript in the built app
        if: steps.built.outputs.cache-hit == 'true'
        shell: pwsh
        run: scripts/windows/rebundle.ps1 -App $env:APP -Hermes $env:HERMES
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-windows-${{ env.SLUG }}-app
          path: ${{ env.APP }}
          if-no-files-found: error
          compression-level: 1
          retention-days: 7
      - name: Host manifest
        if: ${{ !cancelled() && env.CPU == 'x64' }}
        shell: pwsh
        run: |
          $copy = Join-Path "${{ runner.temp }}" "host-manifest-check.exe"
          Copy-Item "$env:APP/Ardia.exe" $copy
          scripts/windows/host-manifest.ps1 -From "$env:APP/ArdiaApp.dll" -To $copy
      - name: Fetch the engine
        id: engine
        if: ${{ !cancelled() && env.CPU == 'x64' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/windows/fetch-engine.ps1 -Cpu x64 -Out "${{ runner.temp }}/engine"
      - name: Assemble with the engine
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/assemble.ps1 -App $env:APP -Engine "${{ runner.temp }}/engine" -Out "${{ runner.temp }}/Ardia" -Build ${{ github.run_number }}
      - name: Launch it
        if: ${{ !cancelled() && env.CPU == 'x64' && (env.FULL == 'true' || steps.engine.outcome != 'success') }}
        shell: pwsh
        run: scripts/windows/launch-smoke.ps1 -App "$env:APP/Ardia.exe" -Out "${{ runner.temp }}/launch"
      - name: Tour
        if: ${{ !cancelled() && env.CPU == 'x64' && env.FULL == 'true' }}
        continue-on-error: true
        timeout-minutes: 12
        shell: pwsh
        run: |
          scripts/windows/tour.ps1 -App "$env:APP/Ardia.exe" -Out "${{ runner.temp }}/tour"
          if (Test-Path "${{ runner.temp }}/tour/tour.md") { Get-Content "${{ runner.temp }}/tour/tour.md" >> $env:GITHUB_STEP_SUMMARY }
      - name: Make the installer
        id: installer
        if: ${{ !cancelled() && env.FULL == 'true' && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/make-installer.ps1 -Source "${{ runner.temp }}/Ardia" -Out "${{ runner.temp }}/installer" -Cpu x64
      - name: Install and uninstall it
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/installer-check.ps1 -Setup "${{ runner.temp }}/installer/Ardia-Setup-x64.exe"
      - if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-Setup-x64
          path: ${{ runner.temp }}/installer
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Launch it with the engine
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/launch-smoke.ps1 -App "${{ runner.temp }}/Ardia/Ardia.exe" -Out "${{ runner.temp }}/launch-engine"
      - name: Tour the pages
        if: ${{ !cancelled() && env.FULL == 'true' && steps.engine.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        shell: pwsh
        run: |
          scripts/windows/tour.ps1 -App "${{ runner.temp }}/Ardia/Ardia.exe" -Out "${{ runner.temp }}/tour-engine" -Only pages
          if (Test-Path "${{ runner.temp }}/tour-engine/tour.md") { Get-Content "${{ runner.temp }}/tour-engine/tour.md" >> $env:GITHUB_STEP_SUMMARY }
      - if: ${{ !cancelled() && env.CPU == 'x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launch-engine
          path: |
            ${{ runner.temp }}/launch-engine
            !${{ runner.temp }}/launch-engine/*-data
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() && env.CPU == 'x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tour-engine
          path: |
            ${{ runner.temp }}/tour-engine
            !${{ runner.temp }}/tour-engine/data
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() && env.CPU == 'x64' && env.FULL == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-windows-x64
          path: ${{ runner.temp }}/Ardia
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() && env.CPU == 'x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tour
          path: ${{ runner.temp }}/tour
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() && env.CPU == 'x64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launch
          path: ${{ runner.temp }}/launch
          if-no-files-found: ignore
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: build-logs-${{ env.SLUG }}
          path: |
            apps/browser/windows/**/*.binlog
            apps/browser/windows/**/*.err
            apps/browser/windows/**/*.wrn
          if-no-files-found: ignore
          retention-days: 14

  arm64-app:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      CPU: ARM64
      SLUG: arm64
      APP: apps/browser/windows/ARM64/Release
      HERMES: .ci/windows-hermes/hermes.exe
      FULL: ${{ needs.gate.outputs.full }}
    steps: *app_steps

  arm64:
    needs: [gate, arm64-app]
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      APP: apps/browser/windows/ARM64/Release
      FULL: ${{ needs.gate.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/windows
            apps/browser/windows/Ardia
            apps/browser/macos/Ardia.xcodeproj
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: Ardia-windows-arm64-app
          path: ${{ env.APP }}
      - name: Host manifest
        shell: pwsh
        run: |
          $copy = Join-Path "${{ runner.temp }}" "host-manifest-check.exe"
          Copy-Item "$env:APP/Ardia.exe" $copy
          scripts/windows/host-manifest.ps1 -From "$env:APP/ArdiaApp.dll" -To $copy
      - name: Fetch the engine
        id: engine
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/windows/fetch-engine.ps1 -Cpu arm64 -Out "${{ runner.temp }}/engine"
      - name: Assemble with the engine
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/assemble.ps1 -App $env:APP -Engine "${{ runner.temp }}/engine" -Out "${{ runner.temp }}/Ardia" -Build ${{ github.run_number }}
      - name: Launch it
        if: ${{ !cancelled() && (env.FULL == 'true' || steps.engine.outcome != 'success') }}
        shell: pwsh
        run: scripts/windows/launch-smoke.ps1 -App "$env:APP/Ardia.exe" -Out "${{ runner.temp }}/launch" -NoInput
      - name: Make the installer
        id: installer
        if: ${{ !cancelled() && env.FULL == 'true' && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/make-installer.ps1 -Source "${{ runner.temp }}/Ardia" -Out "${{ runner.temp }}/installer" -Cpu arm64
      - name: Install and uninstall it
        if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/installer-check.ps1 -Setup "${{ runner.temp }}/installer/Ardia-Setup-arm64.exe"
      - if: ${{ !cancelled() && steps.installer.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-Setup-arm64
          path: ${{ runner.temp }}/installer
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 14
      - name: Launch it with the engine
        if: ${{ !cancelled() && steps.engine.outcome == 'success' }}
        shell: pwsh
        run: scripts/windows/launch-smoke.ps1 -App "${{ runner.temp }}/Ardia/Ardia.exe" -Out "${{ runner.temp }}/launch-engine" -NoInput
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launch-engine-arm64
          path: |
            ${{ runner.temp }}/launch-engine
            !${{ runner.temp }}/launch-engine/*-data
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() && env.FULL == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Ardia-windows-arm64
          path: ${{ runner.temp }}/Ardia
          if-no-files-found: ignore
          retention-days: 14
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: launch-arm64
          path: ${{ runner.temp }}/launch
          if-no-files-found: ignore
          retention-days: 14
