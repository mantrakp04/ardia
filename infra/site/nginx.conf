map $sent_http_content_type $page_cache {
  ~^text/html "no-store";
  default "no-cache";
}

map $http_user_agent $update_version {
  "~^[A-Za-z]+/([0-9][0-9A-Za-z.-]{0,31}) Sparkle/" $1;
  default "";
}
map $arg_first $update_first {
  "1" true;
  default false;
}
map $time_iso8601 $update_day {
  "~^([0-9]{4}-[0-9]{2}-[0-9]{2})T" "$1T00:00:00Z";
}
geo $dollar {
  default "$";
}

map $http_fly_client_ip $client_addr {
  "~^[0-9A-Fa-f.:]{2,45}$" $http_fly_client_ip;
  default $binary_remote_addr;
}
limit_req_zone $client_addr zone=otel:10m rate=20r/s;
limit_req_zone $client_addr zone=otel_budget:10m rate=10r/m;
limit_req_zone $client_addr zone=replay:10m rate=5r/s;
limit_req_zone $client_addr zone=replay_budget:10m rate=4r/m;
limit_req_zone $client_addr zone=reader:1m rate=5r/s;
limit_req_status 429;
limit_conn_zone "$replay_session/$replay_seq.$replay_ext" zone=replay_chunk:1m;
map "$http_x_clickhouse_user:$remote_user" $ch_auth_ok {
  "~^(reader|hekuto):$" 1;
  "~^:(reader|hekuto)$" 1;
  default 0;
}
map $remote_user $ch_authorization {
  "~^(reader|hekuto)$" $http_authorization;
  default "";
}
map "$http_x_clickhouse_user:$http_x_clickhouse_key:$http_authorization" $ch_empty_password {
  "~^[^:]+::" 1;
  "~*^::basic\s+(cmVhZGVyOg|aGVrdXRvOg)={0,2}\s*$" 1;
  default 0;
}
map $time_iso8601 $replay_day {
  "~^([0-9]{4}-[0-9]{2}-[0-9]{2})T" "$1";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  absolute_redirect off;

  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  add_header_inherit merge;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
  add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src 'self'; form-action 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  gzip on;
  gzip_static on;
  gzip_proxied any;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml model/gltf-binary;

  location /_assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /demo/assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /otel/v1/logs {
    limit_except POST { deny all; }
    limit_req zone=otel burst=60 nodelay;
    limit_req zone=otel_budget burst=3000 nodelay;
    client_max_body_size 512k;
    client_body_buffer_size 512k;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $otel ${TELEMETRY_COLLECTOR_HOST};
    proxy_pass http://$otel:4318/v1/logs;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type $content_type;
    proxy_set_header Content-Encoding $http_content_encoding;
    proxy_set_header X-Real-IP $http_fly_client_ip;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }

  location ~ "^/otel/replay/(?<replay_session>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/(?<replay_seq>[0-9]{1,6})\.(?<replay_ext>json|json\.gz)$" {
    limit_except POST { deny all; }
    limit_req zone=replay burst=20 nodelay;
    limit_req zone=replay_budget burst=2000 nodelay;
    limit_conn replay_chunk 1;
    limit_conn_status 409;
    client_max_body_size 2m;
    client_body_buffer_size 2m;
    auth_request /_replay_unwritten;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $objects ${TELEMETRY_OBJECTS_HOST};
    proxy_method PUT;
    proxy_pass http://$objects:8888/buckets/replays/$replay_day/$replay_session/$replay_seq.$replay_ext;
    proxy_pass_request_headers off;
    proxy_set_header Content-Type application/octet-stream;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
  }
  location = /_replay_unwritten {
    internal;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $objects ${TELEMETRY_OBJECTS_HOST};
    proxy_method HEAD;
    proxy_pass http://$objects:8888/buckets/replays/$replay_day/$replay_session/$replay_seq.$replay_ext;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header If-Modified-Since "Fri, 31 Dec 9999 23:59:59 GMT";
    proxy_intercept_errors on;
    error_page 404 = @replay_unwritten;
    error_page 304 = @replay_written;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
  }
  location @replay_unwritten {
    return 204;
  }
  location @replay_written {
    return 403;
  }
  location /otel/ {
    return 404;
  }

  location = /_ch {
    rewrite ^ /_ch/ last;
  }
  location ^~ /_ch/ {
    limit_except GET POST { deny all; }
    limit_req zone=reader burst=20 nodelay;
    if ($ch_auth_ok = 0) { return 403; }
    if ($ch_empty_password) { return 403; }
    if ($arg_user) { return 403; }
    if ($arg_password) { return 403; }
    client_max_body_size 64m;
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $ch ${TELEMETRY_CLICKHOUSE_HOST};
    rewrite ^/_ch/(.*)$ /$1 break;
    proxy_pass http://$ch:8123;
    proxy_set_header Host $ch;
    proxy_set_header Authorization $ch_authorization;
    proxy_set_header Cookie "";
    proxy_read_timeout 300s;
    proxy_request_buffering off;
  }

  location ^~ /_replays/ {
    limit_except GET { deny all; }
    limit_req zone=reader burst=40;
    if ($http_authorization != "Bearer ${TELEMETRY_REPLAYS_READ_TOKEN}") { return 401; }
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $objects ${TELEMETRY_OBJECTS_HOST};
    rewrite ^/_replays/(.*)$ /buckets/replays/$1 break;
    proxy_pass http://$objects:8888;
    proxy_pass_request_headers off;
    proxy_set_header Accept $http_accept;
  }

  location = /appcast.xml {
    mirror /_update_check;
    mirror_request_body off;
    root /var/empty;
    log_not_found off;
    add_header Cache-Control "no-store" always;
    error_page 404 =302 https://github.com/mantrakp04/ardia/releases/latest/download/appcast.xml;
  }

  location = /nightly {
    add_header Cache-Control "no-store" always;
    return 302 https://github.com/mantrakp04/ardia/releases/download/nightly/Ardia-Nightly.dmg;
  }

  location = /_update_check {
    internal;
    if ($request_method != GET) { return 204; }
    if ($update_version = "") { return 204; }
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=on;
    set $otel ${TELEMETRY_COLLECTOR_HOST};
    proxy_pass http://$otel:4318/v1/logs;
    proxy_method POST;
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Type application/json;
    proxy_set_body '{"resourceLogs":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"ardia-feed"}}]},"scopeLogs":[{"scope":{"name":"ardia.analytics"},"logRecords":[{"severityNumber":9,"body":{"stringValue":"update_check"},"attributes":[{"key":"event","value":{"stringValue":"update_check"}},{"key":"uuid","value":{"stringValue":"$request_id"}},{"key":"distinct_id","value":{"stringValue":"update-check"}},{"key":"timestamp","value":{"stringValue":"$update_day"}},{"key":"version","value":{"stringValue":"$update_version"}},{"key":"first","value":{"boolValue":$update_first}},{"key":"${dollar}lib","value":{"stringValue":"ardia-feed"}}]}]}]}]}';
    proxy_connect_timeout 2s;
    proxy_send_timeout 2s;
    proxy_read_timeout 2s;
  }

  location / {
    etag off;
    if_modified_since off;
    add_header Last-Modified "";
    add_header Cache-Control $page_cache;
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
    etag off;
    if_modified_since off;
    add_header Last-Modified "" always;
    add_header Cache-Control "no-store" always;
  }
}
