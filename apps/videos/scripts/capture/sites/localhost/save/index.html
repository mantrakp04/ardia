<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scratchpad</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Helvetica Neue",sans-serif;background:#f6f4f1;color:#1d1b18;min-height:100vh;padding:44px 48px}
header{display:flex;align-items:center;justify-content:space-between;max-width:640px}
h1{font-size:26px;letter-spacing:-.01em}
#saved{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:600;padding:8px 16px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px rgba(30,25,20,.08);transition:background .25s,color .25s}
#saved.flash{background:#2fa34f;color:#fff}
#count{font-variant-numeric:tabular-nums}
p{margin-top:8px;font-size:15px;color:#6b655d}
textarea{display:block;margin-top:22px;width:640px;height:400px;padding:20px 22px;border:0;border-radius:16px;background:#fff;box-shadow:0 20px 50px rgba(30,25,20,.08),0 0 0 1px rgba(30,25,20,.06);font:16px/1.6 ui-monospace,Menlo,monospace;color:#1d1b18;resize:none;outline:none}
textarea:focus{box-shadow:0 20px 50px rgba(30,25,20,.08),0 0 0 2px #3478f6}
</style>
</head>
<body>
<header><h1>Scratchpad</h1><div id="saved">⌘S saves · <span id="count">0</span></div></header>
<p>Saves on ⌘S the way an online editor does, without stopping the key.</p>
<textarea id="editor" spellcheck="false">function twoSum(nums, target) {
  const seen = new Map();
  for (let i = 0; i &lt; nums.length; i++) {
    const want = target - nums[i];
    if (seen.has(want)) return [seen.get(want), i];
    seen.set(nums[i], i);
  }
}
</textarea>
<script>
const saved = document.getElementById("saved");
const count = document.getElementById("count");
document.addEventListener("keydown", (e) => {
  if (!e.metaKey || e.key.toLowerCase() !== "s" || e.repeat) return;
  count.textContent = String(Number(count.textContent) + 1);
  saved.classList.add("flash");
  setTimeout(() => saved.classList.remove("flash"), 450);
});
</script>
</body>
</html>
