apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def nodeResolve = { String expression -> ["node", "--print", expression].execute(null, rootDir).text.trim() }
def reactNativePackage = nodeResolve("require.resolve('react-native/package.json')")

react {
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", projectRoot, "android", "absolute"].execute(null, rootDir).text.trim())
    reactNativeDir = new File(reactNativePackage).getParentFile().getAbsoluteFile()
    hermesCommand = new File(reactNativePackage).getParentFile().getAbsolutePath() + "/sdks/hermesc/%OS-BIN%/hermesc"
    codegenDir = new File(nodeResolve("require.resolve('@react-native/codegen/package.json', { paths: [require.resolve('react-native/package.json')] })")).getParentFile().getAbsoluteFile()
    enableBundleCompression = (findProperty('android.enableBundleCompression') ?: false).toBoolean()
    cliFile = new File(nodeResolve("require.resolve('@expo/cli', { paths: [require.resolve('expo/package.json')] })"))
    bundleCommand = "export:embed"
    autolinkLibrariesWithApp()
}

def ardiaLab = findProperty('ardiaLab') == 'true'
if (ardiaLab != (System.getenv('EXPO_PUBLIC_ARDIA_LAB') == 'true')) {
    throw new GradleException("-PardiaLab and EXPO_PUBLIC_ARDIA_LAB disagree: build through apps/phone/scripts/gradle-locked, or set both or neither")
}
tasks.matching { it.name.startsWith('createBundle') && it.name.endsWith('JsAndAssets') }.configureEach { inputs.property('ardiaLab', ardiaLab) }

def composeApp = "${projectRoot}/../android/app/src/main"
def composeSystemInThisApp = ['ArdiaWidgets.kt', 'SystemSnapshot.kt', 'SystemSnapshots.kt', 'SearchTileService.kt']
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    exclude { element -> !element.directory && element.file.canonicalPath.startsWith(new File("${composeApp}/kotlin").canonicalPath) && !(element.name in composeSystemInThisApp) }
}

def enableMinifyInReleaseBuilds = (findProperty('android.enableMinifyInReleaseBuilds') ?: false).toBoolean()

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace 'com.ardia.browser.android'
    sourceSets.main.res.srcDirs += "${composeApp}/res-system"
    sourceSets.main.java.srcDirs += "${composeApp}/kotlin"
    defaultConfig {
        applicationId 'com.ardia.browser.android'
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "REACT_NATIVE_RELEASE_LEVEL", "\"${findProperty('reactNativeReleaseLevel') ?: 'stable'}\""
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            shrinkResources((findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false').toBoolean())
            minifyEnabled enableMinifyInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            crunchPngs((findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true').toBoolean())
        }
    }
    packagingOptions {
        jniLibs {
            useLegacyPackaging((findProperty('expo.useLegacyPackaging') ?: 'false').toBoolean())
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation(project(":ardia-design"))
    implementation("androidx.glance:glance-appwidget:1.2.0")
}
